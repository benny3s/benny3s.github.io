<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f7f7f5">
<title>Benny</title>
<meta name="description" content="Benny의 프로젝트 모음">
<style>
/* 항상 라이트 — 약속 잡자·밴드매니저와 같게 (2026-10-01 Benny: "라이트 모드로 안돼?") */
:root{
  color-scheme:light;
  --bg:#f5f5f2; --card:#ffffff; --line:#e5e4df; --ink:#181816; --muted:#6b6b64;
  --accent:#287047; --accent-soft:#e6f2eb; --shadow:0 1px 3px rgba(0,0,0,.04), 0 6px 16px rgba(0,0,0,.035);
  --shadow-hover:0 4px 12px rgba(0,0,0,.07), 0 10px 24px rgba(0,0,0,.05);
  --warn:#b25918; --hide:#f2f0ea;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
       "Malgun Gothic",system-ui,sans-serif;
  padding:0 16px 68px; -webkit-text-size-adjust:100%;
}
.wrap{max-width:860px;margin:0 auto}

header{padding-block:32px 20px;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.mark{
  width:42px;height:42px;border-radius:13px;
  background:linear-gradient(145deg,#328255,#215c3a);
  box-shadow:0 2px 6px rgba(40,112,71,.25);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:20px;letter-spacing:-.03em;
  user-select:none;flex-shrink:0
}
.ttl{flex:1;min-width:160px}
.ttl-row{display:flex;align-items:center;gap:8px}
h1{margin:0;font-size:22px;font-weight:800;line-height:1.2;letter-spacing:-.03em;user-select:none;cursor:default;display:inline-block}
.admin-badge{
  display:none;align-items:center;gap:4px;font-size:11.5px;font-weight:700;
  padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);
}
body.admin .admin-badge{display:inline-flex}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* 보기 방식: 자세히(대표+묶음) / 간단히(아이콘만) — 2026-10-19 Benny: "간단히 보기 스위치도" */
.viewsw{display:flex;padding:3px;border-radius:10px;background:#e8e7e1;flex-shrink:0}
.viewsw button{display:flex;align-items:center;justify-content:center;width:32px;height:28px;padding:0;border:0;border-radius:8px;background:none;color:#85857e;cursor:pointer;transition:all .12s ease}
.viewsw svg{width:15px;height:15px;fill:currentColor}
.viewsw button[aria-pressed="true"]{background:#fff;color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.viewsw button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
body.admin:not([data-tab="portal"]) .viewsw{display:none}

/* 방문자 & 포털 홈 화면 */
.ico{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:23px;line-height:1;flex-shrink:0;background:var(--t,#efeee8);border:1px solid rgba(0,0,0,.04)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:#f0efe9;color:var(--muted);vertical-align:2px;margin-left:6px;white-space:nowrap}
.chip.priv{background:#f7ece6;color:#9c4a1a}
.clamp{margin:2px 0 0;color:var(--muted);font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero{
  display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:18px;color:var(--ink);text-decoration:none;
  background:linear-gradient(135deg,#ffffff 0%,#f0f7f3 100%);
  border:1px solid #cce0d4;
  box-shadow:var(--shadow);
  margin-bottom:22px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease
}
.hero:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:var(--accent)}
.hero .ico{width:54px;height:54px;font-size:27px;border-radius:15px;background:#dff0e6;border:1px solid rgba(40,112,71,.12)}
.hero .k{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:99px;margin-bottom:3px}
.hero .nm{font-size:17.5px;font-weight:800;letter-spacing:-.02em;margin:0}
.hero .clamp{color:#4a5550;-webkit-line-clamp:2}
.hero .go{margin-left:auto;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:6px 12px;border-radius:99px;flex-shrink:0;transition:background .15s ease,color .15s ease}
.hero:hover .go{background:var(--accent);color:#fff}
.sec{margin:0 0 24px}
.sec-head{display:flex;align-items:center;gap:8px;margin:0 2px 10px}
.sec h2{font-size:13px;font-weight:700;color:var(--muted);margin:0;letter-spacing:-.01em}
.sec .scnt{font-size:11.5px;color:#96968e;font-weight:600}
.rows{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media(min-width:560px){.rows{grid-template-columns:repeat(2,minmax(0,1fr))}}
.row{display:flex;align-items:center;gap:13px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:15px;
  padding:14px 15px;box-shadow:var(--shadow);text-decoration:none;color:inherit;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.row:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:#c8c7bf}
.row.priv-row{background:#fcfbf8;border-style:dashed;border-color:#dcd8ce}
.row.priv-row:hover{border-style:solid;border-color:var(--accent)}
.row .t{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:15px;letter-spacing:-.015em;line-height:1.3}
.row .go{color:#b0b0a8;font-size:18px;flex-shrink:0;transition:transform .15s ease,color .15s ease}
.row:hover .go{transform:translateX(2px);color:var(--accent)}
.tower-live{font-size:12px !important;color:var(--accent) !important;font-weight:600;margin-top:4px !important}
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px 8px;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:22px 12px;box-shadow:var(--shadow)}
@media(min-width:640px){.apps{grid-template-columns:repeat(6,minmax(0,1fr))}}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;text-align:center;text-decoration:none;color:inherit;position:relative}
.app .ico{width:56px;height:56px;border-radius:16px;font-size:28px;transition:transform .14s ease,box-shadow .14s ease}
.app:hover .ico{transform:translateY(-2px) scale(1.04);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.app .nm{font-size:12.5px;font-weight:600;letter-spacing:-.02em;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.list{display:flex;flex-direction:column;gap:10px}
.card{
  display:block;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:15px 16px;box-shadow:var(--shadow);
  transition:border-color .12s ease;
}
.top{display:flex;align-items:center;gap:10px}
.emoji{font-size:20px;line-height:1;flex-shrink:0}
.name{font-size:15.5px;font-weight:700;letter-spacing:-.015em;flex:1;min-width:0}
.desc{margin:6px 0 0;color:var(--muted);font-size:13px;white-space:pre-line}
.host{margin:6px 0 0;color:var(--muted);font-size:11.5px;opacity:.75;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}

/* 관리자 편집 툴바 (포털 편집 탭에서만 표시) */
.adminbar{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;padding:11px 14px;
  border:1px solid #cce0d4;border-radius:14px;background:#eef6f1;font-size:13px}
body.admin[data-tab="edit"] .adminbar{display:flex}
.adminbar b{flex:1;min-width:140px;color:var(--accent)}
.btn{font:inherit;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:border-color .12s ease,background .12s ease}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#215c3a}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:5px 8px}
.btn.ghost:hover{background:#eae9e3;color:var(--ink)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.hidden-item{background:var(--hide);border-style:dashed}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--warn);flex-shrink:0}
.tag.grp{color:var(--muted)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.edit{display:grid;gap:7px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.edit[hidden]{display:none}
.edit label{font-size:12px;color:var(--muted);display:grid;gap:3px}
.edit input,.edit textarea{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
.edit textarea{min-height:58px;resize:vertical}
.dirty{color:var(--warn);font-size:12px;font-weight:700}
.previewbar{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 16px;padding:10px 14px;
  border-radius:13px;background:var(--ink);color:#fff;font-size:13px}
body.preview .previewbar{display:flex}
.previewbar span{flex:1;min-width:150px}
.previewbar small{display:block;opacity:.75;font-size:11.5px}

dialog{border:0;border-radius:16px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.2);max-width:min(340px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{margin:0 0 10px;font-size:17px}
dialog input{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;border:0;padding:0;box-shadow:none;background:none}
dialog .msg{font-size:12.5px;color:var(--warn);min-height:18px;margin-top:6px}

/* 관리자 상단 탭 — 관리자 로그인 상태면 3번 클릭 없이 항상 자동 표시 */
.tabs{display:none;gap:4px;padding:4px;margin:0 0 20px;border-radius:13px;background:#e8e7e1;overflow-x:auto;scrollbar-width:none;align-items:center}
.tabs::-webkit-scrollbar{display:none}
body.admin .tabs{display:flex}
.tabs button[role="tab"]{flex:1 0 auto;font:inherit;font-size:13px;font-weight:600;padding:8px 13px;border:0;border-radius:10px;background:none;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .12s ease}
.tabs button[role="tab"]:hover{color:var(--ink)}
.tabs button[role="tab"][aria-selected="true"]{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tabs button[role="tab"]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ctool{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctool input[type=search]{flex:1;min-width:160px;font:inherit;font-size:14px;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:#fff}
.ctool .cnt{font-size:12px;color:var(--muted)}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{font:inherit;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.fchip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cgrp h2{font-size:13px;font-weight:700;color:var(--muted);margin:12px 2px 8px}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media(min-width:640px){.cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pcard{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.pcard.missing{opacity:.65;border-style:dashed}
.pcard .top{flex-wrap:wrap;gap:4px 6px}
.pcard .name{font-size:15.5px;flex:1 1 auto}
.pcard .chip{margin-left:0}
.pcard .desc{white-space:pre-line}
.mono{margin:7px 0 0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--muted);word-break:break-all}
.chip.s-github{background:#e3f1e8;color:var(--accent)}
.chip.s-drive{background:#e3ecfb;color:#2c5aa0}
.chip.s-local{background:#efeee8;color:var(--muted)}
.chip.nda{background:#fbe4e0;color:#a3361b}
.chip.warn{background:#fbf1d6;color:var(--warn)}
.chip.run{background:var(--accent);color:#fff}
.edit select{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
.edit .acts{display:flex;gap:6px;justify-content:flex-end}
.rn{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.rn[hidden]{display:none}
.rn input{flex:1;min-width:140px;font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.msgline{font-size:12px;margin:6px 0 0;color:var(--muted);min-height:0}
.msgline.err{color:var(--warn)}
.msgline.ok{color:var(--accent)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);font-size:13.5px}
.empty .btn{margin-top:10px}
.scard{display:flex;gap:12px;align-items:flex-start;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow)}
.scard .ico{width:38px;height:38px;font-size:19px;border-radius:11px}
.scard .t{flex:1;min-width:0}
.scard .nm{font-weight:700;font-size:14.5px;letter-spacing:-.015em;word-break:break-all}
.scard .chip{margin-left:0;margin-top:4px}
.ssum{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.ssum b{color:var(--ink)}
footer{margin-top:38px;color:var(--muted);font-size:12px;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
body.admin #adminEnterBtn{display:none}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="mark">B</div>
    <div class="ttl">
      <div class="ttl-row">
        <h1 id="brand">Benny</h1>
        <span class="admin-badge">👑 관리자</span>
      </div>
      <p class="sub">만들어 둔 것들 모아놓은 곳</p>
    </div>
    <div class="hdr-right">
      <div class="viewsw" role="group" aria-label="보기 방식">
        <button type="button" data-view="full" title="자세히 보기" aria-label="자세히 보기"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="4.5" rx="1.2"/><rect x="2" y="9" width="12" height="4.5" rx="1.2"/></svg></button><button type="button" data-view="simple" title="간단히 보기" aria-label="간단히 보기"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1.2"/><rect x="9" y="2" width="5" height="5" rx="1.2"/><rect x="2" y="9" width="5" height="5" rx="1.2"/><rect x="9" y="9" width="5" height="5" rx="1.2"/></svg></button>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="관리 메뉴">
    <button type="button" role="tab" data-tab="portal">🏠 포털 홈</button>
    <button type="button" role="tab" data-tab="pc">💻 내 PC · 프로젝트</button>
    <button type="button" role="tab" data-tab="sched">⏰ 예약 · 자동시작</button>
    <button type="button" role="tab" data-tab="edit" id="tabEditBtn">⚙️ 카드 편집</button>
  </nav>

  <div class="adminbar">
    <b>포털 카드 관리 <span class="dirty" id="dirty"></span></b>
    <button class="btn" id="add" type="button">+ 새 항목</button>
    <button class="btn primary" id="save" type="button">저장</button>
    <button class="btn" id="peek" type="button">방문자 화면 보기</button>
    <button class="btn" id="logout" type="button">탭 숨기기</button>
  </div>
  <div class="previewbar">
    <span>방문자 화면 미리보기 <small id="peekNote">로그인 안 한 사람에게 보이는 그대로</small></span>
    <button class="btn" id="unpeek" type="button">돌아가기</button>
  </div>

  <div class="list" id="list"></div>

  <footer>
    <span>github.com/benny3s</span>
    <button class="btn ghost" id="adminEnterBtn" type="button" style="font-size:11.5px;padding:2px 7px">🔒 관리자</button>
  </footer>
</div>

<dialog id="login">
  <form method="dialog" id="loginForm">
    <h2>관리자</h2>
    <input type="password" id="pw" autocomplete="current-password" placeholder="관리자 비밀번호" aria-label="관리자 비밀번호">
    <div class="msg" id="loginMsg"></div>
    <div class="row">
      <button class="btn" type="button" id="cancel">취소</button>
      <button class="btn primary" type="submit" id="go">들어가기</button>
    </div>
  </form>
</dialog>

<script>
/* 기본 목록. 관리자 모드에서 숨김/공개·문구를 바꾸면 Firestore portal/config 문서(json 필드)에 저장되고,
   그 문서가 있으면 이 기본값 대신 그걸 씀. 숨김은 '단순 숨김'(보호가 필요한 자료는 링크 대상에서 따로 보호).
   관리자 확인은 베니브릿지 서버 adminLogin(같은 관리자 비번, 실패 잠금 포함) — 이 페이지엔 비번이 남지 않음.
   로그인은 베니브릿지와 공유(같은 주소·같은 Firebase 프로젝트의 기본 앱): 한쪽에서 관리자로 로그인하면 다른 쪽도 관리자. */
/* 기본 목록 = 저장된 문구와 똑같이 (2026-10-09 — 다르면 첫 방문자 화면에서 글자가 바뀌어 보였다)
   GitHub Actions(.github/workflows/sync-portal-defaults.yml)가 매일 서버 문구로 맞춘다 (2026-10-10) */
/* DEFAULT_ITEMS:START — 아래 목록은 tools/sync_portal_defaults.py 가 서버 문구로 자동으로 맞춘다 */
const DEFAULT_ITEMS = [
  { id: "bridge", emoji: "🌉", name: "베니브릿지", desc: "아는 사람이 건넨 링크로 연결되는, 신뢰 기반 커뮤니티", url: "https://benny3s.github.io/bridge/", hidden: false },
  { id: "band", emoji: "🎸", name: "밴드매니저", desc: "합주 일정 취합 · 합주곡 · 합주 일정 관리", url: "https://benny3s.github.io/band-manager/", hidden: false },

async function towerApi(path, body) {
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), body ? 20000 : 12000);
  try {
    const opt = { cache: "no-store", signal: ctl.signal };
    if (body) {
      opt.method = "POST";
      opt.headers = { "Content-Type": "application/json", "X-Bridge-Token": catToken };
      opt.body = JSON.stringify(body);
    }
    let r; try { r = await fetch(TOWER + path, opt); } catch (_) { r = await fetch("http://127.0.0.1:8999" + path, opt); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.ok === false) throw new Error(j.error || ("HTTP " + r.status));
    return j;
  } catch (e) {
    throw new Error(e.name === "AbortError" ? "응답 시간 초과" : (e.message || String(e)));

}

function loadScript(src) { return new Promise((ok, bad) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s); }); }
let loading = null;
function ensureFirebase() {
  if (app) return Promise.resolve(app);
  if (loading) return loading;
  loading = (async () => {
    await loadScript(SDK + "firebase-app-compat.js");
    await Promise.all(["firebase-auth-compat.js", "firebase-functions-compat.js", "firebase-firestore-compat.js"].map(f => loadScript(SDK + f)));
    // 기본 앱 + 기본(브라우저에 남는) 로그인 = 베니브릿지(같은 주소·같은 프로젝트)와 로그인 공유
    const a = firebase.apps.length ? firebase.app() : firebase.initializeApp(FB);
    app = a;
    return a;
  })();
  return loading;
}
/* ── 로그인 공유: 베니브릿지가 남긴 로그인(IndexedDB)을 먼저 가볍게 보고, 관리자일 때만 SDK를 불러 확인 */
const AUTH_KEY = "firebase:authUser:" + FB.apiKey + ":[DEFAULT]";
function storedUid() {
  return new Promise(ok => {
    try {
      const req = indexedDB.open("firebaseLocalStorageDb");
      req.onupgradeneeded = () => { req.transaction.abort(); ok(""); };  // 저장된 게 없으면 새로 만들지 않음
      req.onerror = () => ok("");
      req.onsuccess = () => {
        const db = req.result;
        try {
          const g = db.transaction("firebaseLocalStorage", "readonly").objectStore("firebaseLocalStorage").get(AUTH_KEY);
          g.onsuccess = () => { const v = g.result && g.result.value; ok((v && v.uid) || ""); db.close(); };
          g.onerror = () => { ok(""); db.close(); };
        } catch (e) { ok(""); db.close(); }
      };
    } catch (e) { ok(""); }
  });
}
async function isAdminSession() {
  if ((await storedUid()) !== "admin") return false;
  try {
    const a = await ensureFirebase();
    // 저장된 로그인이 깨져 있으면 상태 알림이 안 올 수 있어 8초 제한
    const u = await new Promise(ok => {
      const t = setTimeout(() => ok(null), 8000);
      const off = a.auth().onAuthStateChanged(x => { clearTimeout(t); off(); ok(x); }, () => { clearTimeout(t); ok(null); });
    });
    if (!u) return false;
    const r = await u.getIdTokenResult();
    return r.claims.admin === 1;
  } catch (e) { return false; }
}

function warmUp() {  // 서버 함수가 잠들어 있으면 깨우기: 빈 비번은 서버가 바로 거절(실패 횟수에 안 셈)
  ensureFirebase().then(a => a.functions("asia-northeast3").httpsCallable("adminLogin")({ password: "" })).catch(() => {});
}

const ADMIN_AT = "bennyAdminAt";

function enterAdmin() {
  admin = true; preview = false;
  document.body.classList.add("admin");
  try {
    localStorage.setItem(ADMIN_AT, String(Date.now()));
    localStorage.setItem(ADMIN_SESSION_KEY, "1");
    localStorage.removeItem(ADMIN_OFF_KEY);
  } catch (e) {}
  render();
}
function exitAdmin(manualOff) {
  try {
    localStorage.removeItem(ADMIN_AT);
    localStorage.removeItem(ADMIN_SESSION_KEY);
    if (manualOff) localStorage.setItem(ADMIN_OFF_KEY, "1");
  } catch (e) {}
  admin = false; preview = false;
  document.body.classList.remove("admin", "preview");
  render();
}
function setPreview(on) {  // 관리자 상태는 그대로 두고 화면만 방문자처럼

    dirty = false; st.textContent = "· 저장됨";
    const eb = document.getElementById("tabEditBtn");
    if (eb) eb.textContent = "⚙️ 카드 편집";
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(items)); } catch (e) {}
  } catch (err) { st.textContent = "· 저장 실패: " + (err && err.message ? err.message : err); }
};
document.getElementById("logout").onclick = async () => {
  if (dirty) { document.getElementById("dirty").textContent = "· 저장 안 한 변경이 있어요 (저장 후 나가기)"; dirty = false; return; }
  // 로그아웃은 하지 않음(하면 베니브릿지도 같이 로그아웃) — 관리자 탭만 숨김
  exitAdmin(true);
};

/* 이전에 관리자 로그인 상태였으면 첫 렌더부터 깜빡임 없이 바로 탭 표시 */
try {
  if (localStorage.getItem(ADMIN_OFF_KEY) !== "1" && (localStorage.getItem(ADMIN_SESSION_KEY) === "1" || localStorage.getItem(ADMIN_AT))) {
    admin = true;
    document.body.classList.add("admin");
  }
} catch (e) {}

/* 첫 화면 = 이 기기가 지난번에 받은 목록(있으면) → 서버 목록이 오면 바뀐 게 있을 때만 다시 그린다.
   기억해 둔 게 없으면 서버를 최대 2.5초 기다렸다 그린다 (2026-10-09 Benny: "새로고침하면 글자가 바뀌네") */
const CACHE_KEY = "portalItems";
let drawn = false;
const drawOnce = () => { drawn = true; render(); };
try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); if (Array.isArray(c) && c.length){ items = c; DEFAULT_ITEMS.forEach(d => { if (!items.some(x => x.id === d.id)) items.push({ ...d }); }); drawOnce(); } } catch (e) {}
const before = JSON.stringify(items);
setTimeout(() => { if (!drawn) drawOnce(); }, 2500);
loadConfig().then(() => { if (!drawn || JSON.stringify(items) !== before) drawOnce(); });

/* 백그라운드에서 IndexedDB 관리자 세션(베니브릿지 공유 포함) 자동 감지 → 3번 클릭 없이 바로 관리자 탭 활성화 */
try {
  if (localStorage.getItem(ADMIN_OFF_KEY) !== "1") {
    storedUid().then(uid => {
      if (uid === "admin") {
        if (!admin) enterAdmin();
        isAdminSession().then(ok => { if (!ok && admin) exitAdmin(false); });
      } else if (admin) {
        exitAdmin(false);
      }
    });
  }
} catch (e) {}
</script>
</body>
</html>
