<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f7f7f5">
<title>Benny</title>
<meta name="description" content="Benny의 프로젝트 모음">
<style>
/* 항상 라이트 — 약속 잡자·밴드매니저와 같게 (2026-10-01 Benny: "라이트 모드로 안돼?") */
:root{
  color-scheme:light;
  --bg:#f7f7f5; --card:#fff; --line:#e4e4e0; --ink:#1b1b19; --muted:#6e6e67;
  --accent:#2f7d4f; --shadow:0 1px 2px rgba(0,0,0,.05), 0 6px 18px rgba(0,0,0,.04);
  --warn:#a3561b; --hide:#f1efe9;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
       "Malgun Gothic",system-ui,sans-serif;
  padding:0 16px 60px; -webkit-text-size-adjust:100%;
}
.wrap{max-width:820px;margin:0 auto}
body.admin .wrap{max-width:620px}

header{padding-block:44px 28px;display:flex;align-items:center;gap:12px}
.mark{
  width:42px;height:42px;border-radius:12px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:20px;letter-spacing:-.03em;
  user-select:none;flex-shrink:0
}
.ttl{flex:1;min-width:0}
h1{margin:0;font-size:24px;line-height:1.2;letter-spacing:-.03em;user-select:none;cursor:default;display:inline-block}
.sub{margin:2px 0 0;color:var(--muted);font-size:13.5px}

/* 보기 방식: 자세히(대표+묶음) / 간단히(아이콘만) — 2026-10-19 Benny: "간단히 보기 스위치도" */
.viewsw{display:flex;padding:3px;border-radius:99px;background:#ecebe6;flex-shrink:0}
.viewsw button{display:flex;align-items:center;justify-content:center;width:32px;height:28px;padding:0;border:0;border-radius:99px;background:none;color:#8d8d86;cursor:pointer}
.viewsw svg{width:15px;height:15px;fill:currentColor}
.viewsw button[aria-pressed="true"]{background:#fff;color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.viewsw button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
body.admin .viewsw{display:none}

/* 방문자 화면 — 아이콘 색 배경, 설명 두 줄까지 */
.ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:23px;line-height:1;flex-shrink:0;background:var(--t,#efeee8)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:#f1efe9;color:var(--muted);vertical-align:2px;margin-left:5px;white-space:nowrap}
.clamp{margin:0;color:var(--muted);font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero{display:flex;align-items:center;gap:16px;padding:20px;border-radius:18px;color:#fff;text-decoration:none;
  background:linear-gradient(135deg,#2f7d4f,#1f5c3a);box-shadow:0 2px 4px rgba(20,20,10,.05),0 12px 28px rgba(20,20,10,.1);
  margin-bottom:28px;transition:transform .14s ease}
.hero:hover{transform:translateY(-2px)}
.hero .ico{width:54px;height:54px;font-size:28px;border-radius:14px;background:rgba(255,255,255,.16)}
.hero .k{font-size:11.5px;font-weight:600;opacity:.75}
.hero .nm{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:1px 0 2px}
.hero .clamp{color:rgba(255,255,255,.86);-webkit-line-clamp:3}
.hero .go{margin-left:auto;font-size:20px;opacity:.8;flex-shrink:0}
.sec{margin:0 0 26px}
.sec h2{font-size:13px;font-weight:700;color:var(--muted);margin:0 2px 10px}
.rows{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media(min-width:560px){.rows{grid-template-columns:repeat(2,minmax(0,1fr))}}
.row{display:flex;align-items:center;gap:13px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px;box-shadow:var(--shadow);text-decoration:none;color:inherit;transition:transform .14s ease,border-color .14s ease}
.row:hover{transform:translateY(-2px);border-color:#cfcec7}
.row .t{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:15px;letter-spacing:-.015em}
.row .go{color:#a5a59d;flex-shrink:0}
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 8px;background:var(--card);border:1px solid var(--line);
  border-radius:22px;padding:22px 12px;box-shadow:var(--shadow)}
@media(min-width:640px){.apps{grid-template-columns:repeat(6,minmax(0,1fr))}}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;text-align:center;text-decoration:none;color:inherit}
.app .ico{width:58px;height:58px;border-radius:16px;font-size:30px;transition:transform .14s ease}
.app:hover .ico{transform:scale(1.06)}
.app .nm{font-size:12.5px;font-weight:600;letter-spacing:-.02em;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.list{display:flex;flex-direction:column;gap:11px}
.card{
  display:block;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:17px 18px;box-shadow:var(--shadow);
  transition:transform .12s ease, border-color .12s ease;
}
.top{display:flex;align-items:center;gap:11px}
.emoji{font-size:21px;line-height:1;flex-shrink:0}
.name{font-size:16.5px;font-weight:700;letter-spacing:-.015em;flex:1;min-width:0}
.desc{margin:7px 0 0;color:var(--muted);font-size:13.5px;white-space:pre-line}
.host{margin:9px 0 0;color:var(--muted);font-size:11.5px;opacity:.75;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}

/* 관리자 모드 */
.adminbar{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;padding:10px 12px;
  border:1px dashed var(--accent);border-radius:12px;background:#eef6f0;font-size:13px}
body.admin .adminbar{display:flex}
.adminbar b{flex:1;min-width:140px}
.btn{font:inherit;font-size:13px;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.hidden-item{background:var(--hide);border-style:dashed}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--warn);flex-shrink:0}
.tag.grp{color:var(--muted)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.edit{display:grid;gap:7px;margin-top:11px}
.edit[hidden]{display:none}
.edit label{font-size:12px;color:var(--muted);display:grid;gap:3px}
.edit input,.edit textarea{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
.edit textarea{min-height:58px;resize:vertical}
.dirty{color:var(--warn);font-size:12px}
.previewbar{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;padding:9px 12px;
  border-radius:12px;background:var(--ink);color:#fff;font-size:13px}
body.preview .previewbar{display:flex}
.previewbar span{flex:1;min-width:150px}
.previewbar small{display:block;opacity:.75;font-size:11.5px}

dialog{border:0;border-radius:14px;padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.2);max-width:min(340px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.3)}
dialog h2{margin:0 0 10px;font-size:17px}
dialog input{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
dialog .msg{font-size:12.5px;color:var(--warn);min-height:18px;margin-top:6px}

footer{margin-top:34px;color:var(--muted);font-size:11.5px;text-align:center}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="mark">B</div>
    <div class="ttl">
      <h1 id="brand">Benny</h1>
      <p class="sub">만들어 둔 것들 모아놓은 곳</p>
    </div>
    <div class="viewsw" role="group" aria-label="보기 방식">
      <button type="button" data-view="full" title="자세히 보기" aria-label="자세히 보기"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="4.5" rx="1.2"/><rect x="2" y="9" width="12" height="4.5" rx="1.2"/></svg></button><button type="button" data-view="simple" title="간단히 보기" aria-label="간단히 보기"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1.2"/><rect x="9" y="2" width="5" height="5" rx="1.2"/><rect x="2" y="9" width="5" height="5" rx="1.2"/><rect x="9" y="9" width="5" height="5" rx="1.2"/></svg></button>
    </div>
  </header>

  <div class="adminbar">
    <b>관리자 모드 <span class="dirty" id="dirty"></span></b>
    <button class="btn" id="add" type="button">+ 새 항목</button>
    <button class="btn primary" id="save" type="button">저장</button>
    <button class="btn" id="peek" type="button">방문자 화면 보기</button>
    <button class="btn" id="logout" type="button">나가기</button>
  </div>
  <div class="previewbar">
    <span>방문자 화면 미리보기 <small id="peekNote">로그인 안 한 사람에게 보이는 그대로</small></span>
    <button class="btn" id="unpeek" type="button">관리자 화면으로</button>
  </div>

  <div class="list" id="list"></div>

  <footer>github.com/benny3s</footer>
</div>

<dialog id="login">
  <form method="dialog" id="loginForm">
    <h2>관리자</h2>
    <input type="password" id="pw" autocomplete="current-password" placeholder="관리자 비밀번호" aria-label="관리자 비밀번호">
    <div class="msg" id="loginMsg"></div>
    <div class="row">
      <button class="btn" type="button" id="cancel">취소</button>
      <button class="btn primary" type="submit" id="go">들어가기</button>
    </div>
  </form>
</dialog>

<script>
/* 기본 목록. 관리자 모드에서 숨김/공개·문구를 바꾸면 Firestore portal/config 문서(json 필드)에 저장되고,
   그 문서가 있으면 이 기본값 대신 그걸 씀. 숨김은 '단순 숨김'(보호가 필요한 자료는 링크 대상에서 따로 보호).
   관리자 확인은 베니브릿지 서버 adminLogin(같은 관리자 비번, 실패 잠금 포함) — 이 페이지엔 비번이 남지 않음.
   로그인은 베니브릿지와 공유(같은 주소·같은 Firebase 프로젝트의 기본 앱): 한쪽에서 관리자로 로그인하면 다른 쪽도 관리자. */
/* 기본 목록 = 저장된 문구와 똑같이 (2026-10-09 — 다르면 첫 방문자 화면에서 글자가 바뀌어 보였다)
   GitHub Actions(.github/workflows/sync-portal-defaults.yml)가 매일 서버 문구로 맞춘다 (2026-10-10) */
/* DEFAULT_ITEMS:START — 아래 목록은 tools/sync_portal_defaults.py 가 서버 문구로 자동으로 맞춘다 */
const DEFAULT_ITEMS = [
  { id: "bridge", emoji: "🌉", name: "베니브릿지", desc: "아는 사람이 건넨 링크로 연결되는, 신뢰 기반 커뮤니티", url: "https://benny3s.github.io/bridge/", hidden: false },
  { id: "band", emoji: "🎸", name: "밴드매니저", desc: "합주 일정 취합 · 합주곡 · 합주 일정 관리", url: "https://benny3s.github.io/band-manager/", hidden: false },
  { id: "when", emoji: "📅", name: "약속 잡자", desc: "친구들과 약속 잡기 · 되는 날 ○ 안 되는 날 ✕ · 링크만 보내면 끝", url: "https://benny3s.github.io/when/", hidden: false },
  { id: "trip", emoji: "🧳", name: "여행 가자", desc: "공지·일정 · 준비물 준비→완료 · 정산 — 링크 하나로 같이", url: "https://benny3s.github.io/trip/", hidden: false },
  { id: "wishtag", emoji: "🎁", name: "위시태그", desc: "생일 선물이 겹치지 않게 · 친구들이 골라서 선점", url: "https://benny3s.github.io/wishtag/", hidden: false },
  { id: "item1791622306672", emoji: "🎮", name: "게임", desc: "직접 학습시킨 AI와 겨루는 게임 · 친구랑 같이", url: "https://benny3s.github.io/game/", hidden: false },
  { id: "ai", emoji: "🤖", name: "AI 공부방", desc: "강화학습 · 초파리 뇌 · 반도체 설계 실습 기록", url: "https://benny3s.github.io/ai/", hidden: true },
  { id: "shorts", emoji: "🎬", name: "AI 실험 쇼츠", desc: "초파리 뇌로 움직이는 로봇 개 · 벽돌깨기 · 스타1 (비공개 영상관)", url: "https://claude.ai/artifact/WC33rPqhYLhdUcq4PqrJi2", hidden: true },
  { id: "music", emoji: "🎸", name: "Music Lab", desc: "유튜브 링크로 음원 분리 · 코드 · 기타 타브 · 연습 플레이어 (PC 필요)", url: "https://benny3s.github.io/music/", hidden: false },
  { id: "radar", emoji: "📡", name: "AI 레이더", desc: "매주 뜨는 AI — GitHub · Hugging Face · 쇼츠 과장 확인", url: "https://benny3s.github.io/radar/", hidden: false },
  { id: "tower", emoji: "🛰️", name: "관제판", desc: "AI 일꾼 관제판 — 세션별 호출 · 일꾼 순서 · 작업 맡기기 (내 폰·PC 에서만, Tailscale)", url: "https://desktop-ijcbddr.tail4df4c9.ts.net:8443/", hidden: true }
];
/* DEFAULT_ITEMS:END */
const FB = {
  apiKey: "AIzaSyCSueePQfiHaRxUSZxoropiFjiq9arAaTs",
  authDomain: "benny-meeting.firebaseapp.com",
  projectId: "benny-meeting",
  storageBucket: "benny-meeting.firebasestorage.app",
  messagingSenderId: "925758544707",
  appId: "1:925758544707:web:a0c55e596ae0b15e7fadf6"
};
const SDK = "https://www.gstatic.com/firebasejs/10.12.2/";
let items = DEFAULT_ITEMS.map(x => ({ ...x }));
var admin = false; let preview = false, dirty = false, app = null;
const listEl = document.getElementById("list");

/* ── 공개 읽기: 로그인 없이 REST로 portal/config 한 번 */
async function loadConfig() {
  try {
    const r = await fetch("https://firestore.googleapis.com/v1/projects/" + FB.projectId +
      "/databases/(default)/documents/portal/config?key=" + FB.apiKey, { cache: "no-store" });
    if (!r.ok) return;
    const doc = await r.json();
    const j = doc.fields && doc.fields.json && doc.fields.json.stringValue;
    const cfg = j ? JSON.parse(j) : null;
    if (cfg && Array.isArray(cfg.items)) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(cfg.items)); } catch (e) {}   // 다음 방문 땐 이걸 바로 그린다
      items = cfg.items;
      /* 저장된 목록에 없는 기본 항목(새로 만든 앱)은 뒤에 붙인다 — 기본값 그대로(숨김이면 관리자에게만). 관리자가 저장하면 목록에 들어감 (2026-10-09 여행 가자) */
      DEFAULT_ITEMS.forEach(d => { if (!items.some(x => x.id === d.id)) items.push({ ...d }); });
    }
  } catch (e) { /* 실패하면 기본 목록 */ }
}

function host(u) { return String(u || "").replace(/^https?:\/\//, ""); }

/* ── 방문자 화면 (2026-10-19 Benny: "1열로 쭉 깔리니까 보기 힘들다" → 시안 B 대표+묶음, 간단히 보기 = 아이콘만)
   맨 위 공개 항목 = 대표 카드(순서는 관리자 ↑↓). 나머지는 항목의 group(관리자 '묶음' 칸) → 없으면 아래 기본 묶음 → '그 밖에'.
   DEFAULT_ITEMS 블록은 자동으로 덮이니 기본 묶음·색은 여기 따로 둔다. */
const GROUP_DEFAULT = { band: "친구랑 같이", when: "친구랑 같이", trip: "친구랑 같이", wishtag: "친구랑 같이",
  item1791622306672: "실험실", music: "실험실", ai: "실험실", shorts: "실험실", radar: "실험실", tower: "실험실" };
const TINT = { bridge: "#e3f1e8", band: "#fde9dc", when: "#e3ecfb", trip: "#fbf1d6", wishtag: "#fbe4ec",
  item1791622306672: "#ece6fb", music: "#fde3e1", ai: "#e2f3f4", shorts: "#efe7dc", radar: "#e3ecfb", tower: "#e2f3f4" };
const TINTS = ["#e3f1e8", "#fde9dc", "#e3ecfb", "#fbf1d6", "#fbe4ec", "#ece6fb", "#fde3e1", "#e2f3f4"];
function tint(p) {
  if (TINT[p.id]) return TINT[p.id];
  let h = 0; for (const c of String(p.id)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return TINTS[h % TINTS.length];
}
// 설명 끝의 "(PC 필요)" 같은 괄호는 이름 옆 작은 표시로
function splitDesc(d) { d = String(d || ""); const m = /\s*\(([^()]+)\)\s*$/.exec(d); return m ? [d.slice(0, m.index), m[1]] : [d, ""]; }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function icon(p) { const s = el("span", "ico", p.emoji || "•"); s.style.setProperty("--t", tint(p)); return s; }
function nameEl(p, cls, chip) { const n = el("div", cls, p.name); if (chip) n.appendChild(el("span", "chip", chip)); return n; }

const VIEW_KEY = "portalView";
let view = "full";
try { if (localStorage.getItem(VIEW_KEY) === "simple") view = "simple"; } catch (e) {}
function syncViewButtons() { document.querySelectorAll(".viewsw button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === view))); }
document.querySelectorAll(".viewsw button").forEach(b => b.onclick = () => {
  view = b.dataset.view; try { localStorage.setItem(VIEW_KEY, view); } catch (e) {}
  syncViewButtons(); render();
});
syncViewButtons();

function renderVisitor() {
  const shown = items.filter(p => !p.hidden);
  if (view === "simple") {
    const grid = el("div", "apps");
    shown.forEach(p => { const a = el("a", "app"); a.href = p.url; a.title = p.desc || ""; a.append(icon(p), el("span", "nm", p.name)); grid.appendChild(a); });
    listEl.appendChild(grid);
    return;
  }
  const [hero, ...rest] = shown;
  if (hero) {
    const a = el("a", "hero"); a.href = hero.url;
    const t = el("div"); t.append(el("div", "k", "대표 프로젝트"), el("div", "nm", hero.name), el("p", "clamp", hero.desc || ""));
    a.append(icon(hero), t, el("span", "go", "→"));
    listEl.appendChild(a);
  }
  const groups = new Map();
  rest.forEach(p => {
    const g = (p.group || "").trim() || GROUP_DEFAULT[p.id] || "그 밖에";
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(p);
  });
  groups.forEach((list, g) => {
    const sec = el("section", "sec"), rows = el("div", "rows");
    sec.append(el("h2", null, g), rows);
    list.forEach(p => {
      const [d, chip] = splitDesc(p.desc);
      const a = el("a", "row"); a.href = p.url;
      const t = el("div", "t"); t.append(nameEl(p, "nm", chip), el("p", "clamp", d));
      a.append(icon(p), t, el("span", "go", "›"));
      rows.appendChild(a);
    });
    listEl.appendChild(sec);
  });
}

function render() {
  listEl.textContent = "";
  const admin = window.admin && !preview;  // 미리보기 중엔 방문자처럼 그림
  listEl.className = admin ? "list" : "";
  if (!admin) { renderVisitor(); return; }
  // 관리자 화면은 예전처럼 한 줄씩(순서·숨김·수정 도구)
  items.forEach((p, idx) => {
    const card = document.createElement("div");
    card.className = "card" + (p.hidden ? " hidden-item" : "");
    /* 관리자 화면도 카드 아무 데나 누르면 열기 — 버튼·수정 칸은 빼고 (2026-10-09 Benny: "열기 버튼 따로 없애고") */
    card.style.cursor = "pointer";
    card.onclick = e => { if (e.target.closest("button, input, textarea, label, .edit")) return; window.open(p.url, "_blank", "noopener"); };
    const top = document.createElement("div");
    top.className = "top";
    top.innerHTML = '<span class="emoji"></span><span class="name"></span>';
    top.querySelector(".emoji").textContent = p.emoji || "•";
    top.querySelector(".name").textContent = p.name;
    const g = idx === items.findIndex(x => !x.hidden) ? "대표" : ((p.group || "").trim() || GROUP_DEFAULT[p.id] || "그 밖에");
    const gt = document.createElement("span"); gt.className = "tag grp"; gt.textContent = g; top.appendChild(gt);
    if (p.hidden) { const t = document.createElement("span"); t.className = "tag"; t.textContent = "숨김"; top.appendChild(t); }
    card.appendChild(top);
    const d = document.createElement("p"); d.className = "desc"; d.textContent = p.desc || ""; card.appendChild(d);
    const h = document.createElement("p"); h.className = "host"; h.textContent = host(p.url); card.appendChild(h);
    if (p.id === "tower") card.appendChild(towerGlance());
    card.appendChild(adminTools(p, idx));
    listEl.appendChild(card);
  });
}

/* 관제판 카드: PC 관제판의 요약 숫자 (2026-10-24 Benny). Tailscale 에 붙은 내 기기에서만 응답이 오고,
   다른 곳에서는 조용히 "PC 연결 안 됨". 숫자만 받음 (세션 이름 X). */
const TOWER = "https://desktop-ijcbddr.tail4df4c9.ts.net:8443";
function towerGlance() {
  const line = el("p", "desc tower-live", "관제판 확인 중…");
  const ctl = new AbortController(); setTimeout(() => ctl.abort(), 5000);
  fetch(TOWER + "/api/glance", { cache: "no-store", signal: ctl.signal }).then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(g => {
      const parts = [g.running ? "● 지금 실행 중 " + g.running : "쉬는 중", "오늘 " + g.today + "회"];
      if (g.fails) parts.push("⚠ 실패 " + g.fails);
      if (g.resting) parts.push("쉬는 일꾼 " + g.resting);
      line.textContent = parts.join(" · ");
    })
    .catch(() => { line.textContent = "PC 관제판 연결 안 됨 (Tailscale·PC 꺼짐)"; });
  return line;
}

function mark() { dirty = true; document.getElementById("dirty").textContent = "· 저장 안 됨"; }

function adminTools(p, idx) {
  const box = document.createElement("div");
  const tools = document.createElement("div"); tools.className = "tools";
  const mk = (label, fn) => { const b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.textContent = label; b.onclick = fn; tools.appendChild(b); return b; };
  mk(p.hidden ? "공개하기" : "숨기기", () => { p.hidden = !p.hidden; mark(); render(); });
  mk("수정", () => { box.querySelector(".edit").hidden = !box.querySelector(".edit").hidden; });
  mk("↑", () => { if (idx > 0) { [items[idx - 1], items[idx]] = [items[idx], items[idx - 1]]; mark(); render(); } });
  mk("↓", () => { if (idx < items.length - 1) { [items[idx + 1], items[idx]] = [items[idx], items[idx + 1]]; mark(); render(); } });
  box.appendChild(tools);
  const ed = document.createElement("div"); ed.className = "edit"; ed.hidden = true;
  [["emoji", "아이콘(이모지)"], ["name", "이름"], ["desc", "설명"], ["url", "주소"], ["group", "묶음 (비우면 기본 묶음 · 맨 위 공개 항목은 대표 카드)"]].forEach(([k, lab]) => {
    const l = document.createElement("label"); l.textContent = lab;
    const inp = document.createElement(k === "desc" ? "textarea" : "input");
    inp.value = p[k] || "";
    if (k === "group") inp.placeholder = GROUP_DEFAULT[p.id] || "그 밖에";
    inp.oninput = () => { p[k] = inp.value; mark(); };
    inp.onchange = () => render();
    l.appendChild(inp); ed.appendChild(l);
  });
  box.appendChild(ed);
  return box;
}

/* ── Benny 3번 클릭 → 관리자 로그인 */
let clicks = 0, clickTimer = null;
document.getElementById("brand").addEventListener("click", () => {
  if (!app && !loading) ensureFirebase().catch(() => {});  // 첫 클릭부터 미리 불러와서 로그인 대기 줄이기
  clicks++; clearTimeout(clickTimer);
  clickTimer = setTimeout(() => { clicks = 0; }, 700);
  if (clicks >= 3) {
    clicks = 0;
    if (admin) return;
    // 베니브릿지에서 이미 관리자로 로그인돼 있으면 비번 없이 바로
    isAdminSession().then(ok => { if (ok) enterAdmin(); else openLogin(); });
  }
});

function loadScript(src) { return new Promise((ok, bad) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s); }); }
let loading = null;
function ensureFirebase() {
  if (app) return Promise.resolve(app);
  if (loading) return loading;
  loading = (async () => {
    await loadScript(SDK + "firebase-app-compat.js");
    await Promise.all(["firebase-auth-compat.js", "firebase-functions-compat.js", "firebase-firestore-compat.js"].map(f => loadScript(SDK + f)));
    // 기본 앱 + 기본(브라우저에 남는) 로그인 = 베니브릿지(같은 주소·같은 프로젝트)와 로그인 공유
    const a = firebase.apps.length ? firebase.app() : firebase.initializeApp(FB);
    app = a;
    return a;
  })();
  return loading;
}
/* ── 로그인 공유: 베니브릿지가 남긴 로그인(IndexedDB)을 먼저 가볍게 보고, 관리자일 때만 SDK를 불러 확인 */
const AUTH_KEY = "firebase:authUser:" + FB.apiKey + ":[DEFAULT]";
function storedUid() {
  return new Promise(ok => {
    try {
      const req = indexedDB.open("firebaseLocalStorageDb");
      req.onupgradeneeded = () => { req.transaction.abort(); ok(""); };  // 저장된 게 없으면 새로 만들지 않음
      req.onerror = () => ok("");
      req.onsuccess = () => {
        const db = req.result;
        try {
          const g = db.transaction("firebaseLocalStorage", "readonly").objectStore("firebaseLocalStorage").get(AUTH_KEY);
          g.onsuccess = () => { const v = g.result && g.result.value; ok((v && v.uid) || ""); db.close(); };
          g.onerror = () => { ok(""); db.close(); };
        } catch (e) { ok(""); db.close(); }
      };
    } catch (e) { ok(""); }
  });
}
async function isAdminSession() {
  if ((await storedUid()) !== "admin") return false;
  try {
    const a = await ensureFirebase();
    // 저장된 로그인이 깨져 있으면 상태 알림이 안 올 수 있어 8초 제한
    const u = await new Promise(ok => {
      const t = setTimeout(() => ok(null), 8000);
      const off = a.auth().onAuthStateChanged(x => { clearTimeout(t); off(); ok(x); }, () => { clearTimeout(t); ok(null); });
    });
    if (!u) return false;
    const r = await u.getIdTokenResult();
    return r.claims.admin === 1;
  } catch (e) { return false; }
}

function warmUp() {  // 서버 함수가 잠들어 있으면 깨우기: 빈 비번은 서버가 바로 거절(실패 횟수에 안 셈)
  ensureFirebase().then(a => a.functions("asia-northeast3").httpsCallable("adminLogin")({ password: "" })).catch(() => {});
}

const dlg = document.getElementById("login");
function openLogin() { document.getElementById("loginMsg").textContent = ""; document.getElementById("pw").value = ""; dlg.showModal(); document.getElementById("pw").focus(); warmUp(); }
document.getElementById("cancel").onclick = () => dlg.close();
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  const msg = document.getElementById("loginMsg");
  if (!pw) { msg.textContent = "비밀번호를 입력해 주세요."; return; }
  msg.textContent = "확인 중…";
  try {
    const a = await ensureFirebase();
    const res = await a.functions("asia-northeast3").httpsCallable("adminLogin")({ password: pw });
    await a.auth().signInWithCustomToken(res.data.token);
    document.getElementById("pw").value = "";
    dlg.close();
    enterAdmin();
  } catch (err) {
    msg.textContent = (err && err.message) ? err.message : "들어가지 못했어요.";
  }
});

/* 관리자 모드는 'Benny' 3번 클릭으로만 켠다 — 로그인돼 있어도 첫 화면은 늘 방문자 화면 (2026-10-09 Benny: "자꾸 관리자 화면이 먼저 보여 불편")
   켜 있는 동안만 다른 앱(약속 잡자 ?admin)도 관리 화면을 연다 → localStorage bennyAdminAt (6시간) */
const ADMIN_AT = "bennyAdminAt";
function enterAdmin() { admin = true; preview = false; document.body.classList.add("admin"); try { localStorage.setItem(ADMIN_AT, String(Date.now())); } catch (e) {} render(); }
function setPreview(on) {  // 관리자 상태는 그대로 두고 화면만 방문자처럼
  preview = on;
  document.body.classList.toggle("admin", !on);
  document.body.classList.toggle("preview", on);
  document.getElementById("peekNote").textContent = dirty
    ? "저장 안 한 변경 포함 — 저장해야 실제 방문자에게도 이렇게 보여요"
    : "로그인 안 한 사람에게 보이는 그대로";
  render(); window.scrollTo(0, 0);
}
document.getElementById("peek").onclick = () => setPreview(true);
document.getElementById("unpeek").onclick = () => setPreview(false);

document.getElementById("add").onclick = () => {
  items.push({ id: "item" + Date.now(), emoji: "✨", name: "새 항목", desc: "", url: "https://", hidden: true });
  mark(); render();
};
document.getElementById("save").onclick = async () => {
  const st = document.getElementById("dirty");
  try {
    st.textContent = "· 저장 중…";
    await app.firestore().doc("portal/config").set({ json: JSON.stringify({ items }), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    dirty = false; st.textContent = "· 저장됨";
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(items)); } catch (e) {}
  } catch (err) { st.textContent = "· 저장 실패: " + (err && err.message ? err.message : err); }
};
document.getElementById("logout").onclick = async () => {
  if (dirty) { document.getElementById("dirty").textContent = "· 저장 안 한 변경이 있어요 (저장 후 나가기)"; dirty = false; return; }
  // 로그아웃은 하지 않음(하면 베니브릿지도 같이 로그아웃) — 관리자 화면만 끔
  try { localStorage.removeItem(ADMIN_AT); } catch (e) {}
  admin = false; preview = false; document.body.classList.remove("admin", "preview"); render();
};

/* 첫 화면 = 이 기기가 지난번에 받은 목록(있으면) → 서버 목록이 오면 바뀐 게 있을 때만 다시 그린다.
   기억해 둔 게 없으면 서버를 최대 2.5초 기다렸다 그린다 (2026-10-09 Benny: "새로고침하면 글자가 바뀌네") */
const CACHE_KEY = "portalItems";
let drawn = false;
const drawOnce = () => { drawn = true; render(); };
try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); if (Array.isArray(c) && c.length){ items = c; DEFAULT_ITEMS.forEach(d => { if (!items.some(x => x.id === d.id)) items.push({ ...d }); }); drawOnce(); } } catch (e) {}
const before = JSON.stringify(items);
setTimeout(() => { if (!drawn) drawOnce(); }, 2500);
loadConfig().then(() => { if (!drawn || JSON.stringify(items) !== before) drawOnce(); });
/* 자동으로 관리자 모드를 켜지 않는다 (예전 autoAdmin) — Benny 3번 클릭 때 로그인돼 있으면 비번 없이 바로 */
</script>
