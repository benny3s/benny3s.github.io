<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<!-- 스크립트는 이 사이트 것과 Firebase SDK 만 실행 (인라인 · 다른 곳 스크립트 · eval 차단). 통신 · 그림 · 스타일은 막지 않는다 — 로그인 · 중계 길을 건드리지 않게 (11-25) -->
<meta http-equiv="Content-Security-Policy" content="script-src 'self' https://www.gstatic.com/firebasejs/; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#4f46e5">
<title>베니 비서</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="../design/tokens.css?v=2">
<link rel="stylesheet" href="./app.css?v=20261125f">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">B</div>
      <div>
        <h1 class="brand-title">베니 비서</h1>
      </div>
      <span id="connPill" class="conn-pill" title="연결 상태">
        <span class="dot"></span>
        <span id="connLabel">연결 중…</span>
      </span>
    </div>
    <div class="sp"></div>
    <div class="top-actions">
      <button type="button" id="btnLiveMeet" class="btn tonal sm" hidden title="실시간 회의">🎙<span class="lbl"> 회의</span></button>
      <button type="button" id="btnCapture" class="btn sm" title="AI 한 번에 입력">✨<span class="lbl"> 입력</span></button>
      <button type="button" id="btnAlerts" class="btn sm" title="알림함">🔔 <span id="alertCount">0</span></button>
      <button type="button" id="btnNativeSettings" class="btn icon-only sm" hidden title="앱 설정">⚙</button>
      <button type="button" id="btnLogout" class="btn sm" hidden title="관리자 로그아웃 (이 브라우저에서 세션 지우기)">로그아웃</button>
      <button type="button" id="btnRefresh" class="btn icon-only sm" title="새로고침">↻</button>
    </div>
  </header>

  <div class="body-wrap">
    <!-- PC 사이드바 내비게이션 (페이지 내비게이션은 nav + aria-current="page") -->
    <nav class="sidebar" aria-label="주요 화면">
      <button type="button" class="nav-btn" data-page="summary" aria-current="page">
        <span class="ico">📋</span><span>요약</span><span class="nav-badge" data-badge="summary" hidden>0</span>
      </button>
      <button type="button" class="nav-btn" data-page="todo">
        <span class="ico">📅</span><span>할 일 · 일정</span>
      </button>
      <button type="button" class="nav-btn" data-page="chat">
        <span class="ico">💬</span><span>대화</span>
      </button>
      <button type="button" class="nav-btn" data-page="campus">
        <span class="ico">🎓</span><span>캠퍼스</span>
      </button>
      <button type="button" class="nav-btn" data-page="meetings" id="navMeetingsSide" hidden>
        <span class="ico">📝</span><span>회의록</span>
      </button>
    </nav>

    <main class="main" id="mainView">
      <!-- 로그인 필요 시 표시 (회사 PC / 외부 중계) -->
      <section id="loginView" class="card login-card" hidden>
        <div class="card-head">
          <h2 class="card-title">🔐 베니 비서 관리자 로그인</h2>
        </div>
        <p class="meta">집 PC(Tailscale)에 직접 닿지 않는 환경(회사 PC·외부)에서는 베니 포털과 동일한 관리자 인증 후 안전 중계 모드로 열립니다.</p>
        <p class="small">※ 회사 PC 중계에는 회의록·회사 할 일 원문이 포함되지 않습니다.</p>
        <form id="loginForm" style="display:flex;flex-direction:column;gap:10px;margin-top:12px;">
          <input id="loginPw" type="password" autocomplete="current-password" placeholder="관리자 비밀번호" required>
          <button type="submit" id="loginSubmit" class="btn primary">로그인</button>
          <div id="loginMsg" class="small" role="status" aria-live="polite"></div>
        </form>
      </section>

      <!-- 실제 앱 본문 -->
      <div id="appPages">
        <section id="page-summary"></section>
        <section id="page-todo" hidden></section>
        <section id="page-chat" hidden></section>
        <section id="page-campus" hidden></section>
        <section id="page-meetings" hidden></section>
      </div>
    </main>
  </div>

  <!-- 모바일 하단 4탭 내비게이션 -->
  <nav class="bottom-nav" aria-label="하단 메뉴">
    <button type="button" class="nav-btn" data-page="summary" aria-current="page">
      <span class="ico">📋</span><span>요약</span><span class="nav-badge" data-badge="summary" hidden>0</span>
    </button>
    <button type="button" class="nav-btn" data-page="todo">
      <span class="ico">📅</span><span>할 일</span>
    </button>
    <button type="button" class="nav-btn" data-page="chat">
      <span class="ico">💬</span><span>대화</span>
    </button>
    <button type="button" class="nav-btn" data-page="campus">
      <span class="ico">🎓</span><span>캠퍼스</span>
    </button>
    <button type="button" class="nav-btn" data-page="meetings" id="navMeetingsBottom" hidden>
      <span class="ico">📝</span><span>회의록</span>
    </button>
  </nav>
</div>

<!-- 공용 모달 다이얼로그 (light-dismiss closedby="any" + JS 폴백) -->
<dialog id="modalDlg" closedby="any" aria-labelledby="dlgTitle">
  <div class="dlg-head">
    <h2 id="dlgTitle">상세</h2>
    <button type="button" id="dlgClose" class="btn sm">닫기</button>
  </div>
  <div class="dlg-body" id="dlgBody"></div>
</dialog>

<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
<script src="./app.js?v=20261125h"></script>
</body>
</html>
