<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>AI 공부방 연결 | Benny</title>
<link rel="stylesheet" href="/design/tokens.css?v=2">
<style>
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;padding:max(48px,env(safe-area-inset-top,0px)) 16px 32px;font:var(--bn-fs-base)/var(--bn-lh) var(--bn-font);background:var(--bn-bg);color:var(--bn-ink);display:grid;place-items:center}
  main{max-width:420px;width:100%;background:var(--bn-surface);border:1px solid var(--bn-line);border-radius:var(--bn-r-lg);padding:var(--bn-sp-6);box-shadow:var(--bn-shadow-1);text-align:center}
  h1{margin:0 0 var(--bn-sp-2);font-size:var(--bn-fs-lg)}
  p{margin:0 0 var(--bn-sp-4);font-size:var(--bn-fs-md);color:var(--bn-ink-2)}
  .acts{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--bn-sp-2)}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:var(--bn-tap);padding:var(--bn-sp-2) var(--bn-sp-4);border-radius:var(--bn-r-sm);border:1px solid var(--bn-line);background:var(--bn-surface);color:var(--bn-ink);font:600 var(--bn-fs-sm)/1.4 inherit;text-decoration:none;cursor:pointer}
  .btn.primary{background:var(--bn-accent);border-color:var(--bn-accent);color:var(--bn-on-accent)}
  .btn:focus-visible{outline:2px solid var(--bn-accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1 id="ttl">📚 AI 공부방으로 연결 중…</h1>
  <p id="msg" role="status" aria-live="polite">집 PC 로컬 또는 Tailscale 경로를 확인하고 있어요.</p>
  <div class="acts" id="acts" hidden>
    <button type="button" class="btn primary" id="retry">다시 연결</button>
    <a class="btn" href="https://desktop-ijcbddr.tail4df4c9.ts.net:8810/book/">Tailscale 책 열기</a>
    <a class="btn" href="http://127.0.0.1:8810/book/">로컬 PC (127.0.0.1)</a>
    <a class="btn" href="/">포털로 돌아가기</a>
  </div>
</main>
<script>
const TAIL = "https://desktop-ijcbddr.tail4df4c9.ts.net:8810";
const LOCAL = "http://127.0.0.1:8810";
function probe(base, ms) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  return fetch(base + "/api/home", { mode: "no-cors", cache: "no-store", signal: ctl.signal })
    .then(() => base + "/book/")
    .finally(() => clearTimeout(t));
}
async function connect() {
  document.getElementById("ttl").textContent = "📚 AI 공부방으로 연결 중…";
  document.getElementById("msg").textContent = "집 PC 로컬 또는 Tailscale 경로를 확인하고 있어요.";
  document.getElementById("acts").hidden = true;
  // 모바일 기기에서는 로컬 루프백 프로브를 생략해 브라우저 로컬 네트워크 권한 팝업을 방지하고, PC 에서는 로컬 우선 연결
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || "");
  try {
    const probes = isMobile ? [probe(TAIL, 3000)] : [probe(LOCAL, 1000), probe(TAIL, 2800)];
    const target = await Promise.any(probes);
    location.replace(target);
  } catch (_) {
    document.getElementById("ttl").textContent = "공부방 서버에 연결할 수 없어요";
    document.getElementById("msg").textContent = "집 PC 전원이 꺼져 있거나 이 기기의 Tailscale 이 꺼져 있어요. 확인 후 다시 눌러 주세요.";
    document.getElementById("acts").hidden = false;
  }
}
document.getElementById("retry").onclick = connect;
connect();
</script>
</body>
</html>
